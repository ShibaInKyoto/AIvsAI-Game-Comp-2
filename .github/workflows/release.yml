name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.0)"
        required: true
        default: "v1.0.0"
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  GODOT_VERSION: 4.5.1

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot and export templates
        run: |
          mkdir -p ~/godot ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          cd ~/godot
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          unzip -q Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 godot
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          unzip -q -j Godot_v${GODOT_VERSION}-stable_export_templates.tpz \
            templates/windows_release_x86_64.exe templates/windows_debug_x86_64.exe templates/version.txt \
            -d ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/

      - name: Import and test
        run: |
          ~/godot/godot --headless --import || true
          ~/godot/godot --headless --path . -s res://tools/check_scripts.gd
          GODOT=~/godot/godot tools/ci/godot_strict.sh --headless --path . -s res://tests/run_tests.gd
          GODOT=~/godot/godot tools/ci/godot_strict.sh --headless --path . res://tests/flow_test.tscn

      - name: Export Windows build
        run: |
          mkdir -p build/FATHOM
          ~/godot/godot --headless --export-release "Windows Desktop" build/FATHOM/FATHOM.exe
          cp README.md build/FATHOM/README.md
          ~/godot/godot --headless --path . -s res://tools/ci/print_licenses.gd 2>/dev/null | tail -n +2 > build/FATHOM/THIRD_PARTY_LICENSES.txt
          test -s build/FATHOM/THIRD_PARTY_LICENSES.txt
          cp -r assets/fonts/OFL-*.txt build/FATHOM/ || true
          cd build && zip -r FATHOM-windows-x64.zip FATHOM

      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: FATHOM ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: build/FATHOM-windows-x64.zip
          make_latest: true
          body: |
            ## FATHOM - a submarine descent roguelite. Light reveals. Sound betrays.

            ![FATHOM](https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/docs/screenshots/sonar.jpg)

            Pilot a small salvage sub down eleven procedurally generated cave zones,
            through five biomes, to the thing that is singing at the bottom of the trench.

            ### Play (Windows 10/11)
            1. Download **FATHOM-windows-x64.zip** below and extract it anywhere.
            2. Run **FATHOM.exe**. If SmartScreen warns, choose *More info > Run anyway*.

            Needs a GPU with Vulkan or Direct3D 12 (any dedicated GPU from the last decade).

            ### What's inside
            - Eleven procedurally generated cave zones in five biomes, each with its own creatures,
              hazards, music and ambience.
            - Three guardians, each with one weakness to find: the Lamplighter, who sees only light;
              the Blind Mother, who hears only sound; the Ironclad, whose shell only a vent's heat
              cracks. And the Choir at the bottom of the world, which you answer ping for ping.
            - Twelve creature species, thermal vents and loose stalactites, all reacting to one
              light-and-sound stealth system: ambushes, decoys, flares and pings all matter.
            - A trench that reshapes itself around you when the Choir sings, the ruins of Meridian
              Deep, the crew's thirteen logs, and eleven wonders of the deep to witness.
            - Four submarines, 32 modules, 12 hangar upgrades, contracts, a daily dive, pressure
              levels, 17 milestones and a records table.
            - Rebindable controls, photo mode, Assist mode, sound cues, a reduce-flashing option and
              four graphics presets.

            ### Controls
            WASD move - mouse aim the lamp - left mouse harpoon (hold to winch) - right mouse tool -
            Q cycle tool - Space sonar ping - Shift boost - F lamp - Tab chart - Esc pause - F12 screenshot.
            Every key can be rebound in *Settings > Controls*, and gamepads are fully supported.
            *How to dive* on the title screen explains the rest.
